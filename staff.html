<style>
/* Layout: navy header band with the brand, a white points card overlapping it, white cards on a pale blue ground.
   Trust blue and secure green carry the interface; gold is kept for rewards, as on the stand. */
:root{
  --navy:#0e2b20; --blue:#17402f; --sky:#efe9d8; --bg:#f6f1e4; --card:#ffffff; --ink:#16231c; --mute:#4a5a50; --line:#ddd6c4;
  --green:#0b7a5c; --green-bg:#dff0e7; --gold:#d9b068; --gold2:#f3d79c; --gold-ink:#3a2800; --warn:#9f4c15; --bad:#b3342f;
  --display:"Playfair Display",Georgia,serif; --body:"DM Sans",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:30}
[hidden]{display:none!important}
.app{max-width:440px;margin:0 auto;padding-bottom:130px;min-height:100vh}
button,input{font:inherit;color:inherit}
button{border:0;cursor:pointer;border-radius:14px;min-height:48px;padding:12px 18px;background:var(--sky);color:var(--blue);font-weight:700;transition:transform .12s}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--gold-ink);box-shadow:0 8px 20px rgba(217,176,104,.4)}
button.blue{background:linear-gradient(135deg,#f3d79c,#d9b068);color:#14201a;box-shadow:0 8px 20px rgba(217,176,104,.35)}
button.block{width:100%} button.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
input[type=tel],input[type=text]{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;min-height:54px;font-size:18px}
.brand{font:800 28px var(--display);color:#fff} .brand b{color:var(--gold)}
h1{font:800 32px/1.1 var(--display);margin:0;text-wrap:balance} h2{font:700 20px var(--display);margin:0 0 10px}
.mute{color:var(--mute);font-size:14px} .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:14px}
.fine{font-size:14px;color:var(--mute)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* animation */
@keyframes up{from{opacity:.2;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes wave2{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.2);opacity:0}}
@keyframes wave{0%{transform:scale(.4);opacity:.7}100%{transform:scale(2.2);opacity:0}}
@keyframes shine{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(420px) rotate(540deg);opacity:0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,176,104,.55)}50%{box-shadow:0 0 0 12px rgba(217,176,104,0)}}
@keyframes draw{from{stroke-dashoffset:var(--full)}}
.rise{animation:up .5s ease backwards} .d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}

/* welcome */
.band{background:linear-gradient(160deg,var(--navy) 0%,#12362a 70%,#1d4a38 100%);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 70px;color:#fff;border-radius:0 0 28px 28px}
.band.tall{padding-bottom:36px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.secure{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.14);border-radius:99px;padding:5px 11px;font-size:14px;font-weight:700;color:#d6fff1}
.hello{color:#c6d5cc;font-size:14px}
.tapart{position:relative;height:150px;display:grid;place-items:center;margin:8px 0}
.tapart .w{position:absolute;width:80px;height:80px;border-radius:50%;border:2px solid var(--gold);animation:wave 2.4s ease-out infinite}
.tapart .w:nth-child(2){animation-delay:.8s}.tapart .w:nth-child(3){animation-delay:1.6s}
.tapart .core{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,var(--gold2),var(--gold));display:grid;place-items:center;font:800 26px var(--display);color:var(--gold-ink);z-index:1;animation:pulse 2.4s infinite}
.lead{font-size:16px;color:#e4ddc8;margin:10px 0 0}
.band h1{color:#fff;font-size:28px}
.hero2{display:grid;grid-template-columns:128px 1fr;gap:14px;align-items:center;margin-top:16px}
.logo-slot{position:relative;width:84px;height:84px;display:grid;place-items:center}
.logo-slot .w{position:absolute;inset:0;border-radius:50%;border:2px solid var(--gold);animation:wave2 2.4s ease-out infinite}
.logo-slot .w:nth-child(2){animation-delay:1.2s}
.logo-slot .core{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--gold2),var(--gold));display:grid;place-items:center;font:800 22px var(--display);color:var(--gold-ink);z-index:1;animation:pulse 2.4s infinite}
.logo-slot img{width:84px;height:84px;object-fit:contain;position:relative;z-index:1}
.trust{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.trust div{display:flex;gap:8px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;font-size:14px;font-weight:700;color:var(--ink)}
.trust svg{color:var(--green);margin-top:1px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(14,43,32,.08)}
.steps{display:grid;gap:12px}
.step{display:flex;gap:12px;align-items:flex-start}
.dot{flex:0 0 32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800}

/* home */
.pts{margin-top:-52px;position:relative;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{position:relative;width:124px;height:124px}
.ring svg{transform:rotate(-90deg)} .ring .arc{animation:draw 1.1s ease-out;stroke-dashoffset:var(--off)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .n{font:800 34px var(--display);color:var(--navy);font-variant-numeric:tabular-nums;line-height:1}
.ring .l{font-size:14px;color:var(--mute)}
.next{font-weight:700;font-size:17px;text-wrap:balance;color:var(--navy)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--sky);color:var(--blue);border-radius:99px;padding:5px 11px;font-size:14px;font-weight:700}
.chip.g{background:var(--green-bg);color:var(--green)}
.venue{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.venue:first-of-type{border-top:0}
.logo{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font:800 22px var(--display);color:#fff;background:linear-gradient(135deg,#2a6a50,var(--navy))}
.vname{display:flex;gap:6px;align-items:center;font-weight:700}
.ver{color:var(--green);display:inline-flex}
.earn{font-size:14px;color:var(--green);font-weight:700}
.bar{height:10px;background:var(--sky);border-radius:99px;overflow:hidden} .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#37d3a6);border-radius:99px;animation:grow 1s ease-out backwards}
@keyframes grow{from{width:0!important}}

/* offers */
.deals{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;margin:0 -2px}
.deal{flex:0 0 78%;scroll-snap-align:start;border-radius:20px;padding:16px;color:#fff;position:relative;overflow:hidden;display:grid;gap:8px;text-align:left;min-height:150px;align-content:end;background:linear-gradient(150deg,#17402f,#17402f)}
.deal.b2{background:linear-gradient(150deg,#0c6b57,#0b7a5c)} .deal.b3{background:linear-gradient(150deg,#5a2f99,#8a56d6)} .deal.b4{background:linear-gradient(150deg,#a14a0a,#e08a1c)}
.deal::after{content:"";position:absolute;inset:0 auto 0 0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.25),transparent);animation:shine 3.6s infinite}
.deal .vh{position:relative;z-index:1} .deal .t,.deal .tag{position:relative;z-index:1}
.deal .tag{justify-self:start;background:rgba(255,255,255,.2);border-radius:99px;padding:3px 10px;font-size:14px;font-weight:700}
.deal .t{font:800 22px/1.15 var(--display);text-wrap:balance} .deal .v{font-size:14px;opacity:.9}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.filters button{min-height:38px;padding:6px 14px;background:#fff;border:1.5px solid var(--line);color:var(--mute);flex:0 0 auto}
.filters button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.offer{display:grid;gap:8px}
.offer .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.offer .t{font-weight:800;font-size:18px;text-wrap:balance}

/* rewards and code */
.reward{display:grid;gap:10px}
.reward .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.reward .amt{font:800 32px var(--display);color:var(--navy)}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:14px;font-weight:700;background:var(--sky);color:var(--blue)}
.pill.done{background:var(--green-bg);color:var(--green)} .pill.bad{background:#fbe5e3;color:var(--bad)} .pill.pend{background:#fff1d6;color:var(--warn)}
.act{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)} .act:first-of-type{border-top:0}
.act .p{font-weight:800;font-variant-numeric:tabular-nums} .p.plus{color:var(--green)} .p.minus{color:var(--mute)}
.pass{position:relative;overflow:hidden;border-radius:22px;padding:22px;color:#fff;background:linear-gradient(150deg,var(--navy),#1d4a38);text-align:center;display:grid;gap:10px;animation:pop .5s cubic-bezier(.2,1.3,.4,1)}
.pass::after{content:"";position:absolute;inset:0 auto 0 0;width:35%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);animation:shine 3s infinite}
.bigcode{font:800 50px/1 var(--body);letter-spacing:10px;color:var(--gold2);font-variant-numeric:tabular-nums;padding-left:10px}
.pass .v{font-size:14px;color:#c6d5cc}
.timer{height:6px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden} .timer i{display:block;height:100%;background:var(--gold);width:100%;animation:drain 600s linear forwards}
@keyframes drain{to{width:0}}
.toast{background:#fff;border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:12px;font-size:14px}
.toast.good{border-left-color:var(--green)}
.burst{text-align:center;padding:26px 6px;display:grid;gap:12px;position:relative;overflow:hidden}
.burst .plus{font:800 76px/1 var(--display);color:var(--blue);animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
.cf{position:absolute;top:0;width:9px;height:14px;border-radius:2px;animation:fall 2.2s ease-in forwards}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:center;box-shadow:0 -6px 20px rgba(14,43,32,.06)}
.tabs div{display:flex;width:100%;max-width:440px;gap:4px}
.tabs button{flex:1;background:transparent;border-radius:12px;min-height:54px;display:grid;gap:2px;justify-items:center;font-size:14px;color:var(--mute);padding:6px 2px;font-weight:500}
.tabs button[aria-current=page]{color:var(--blue);background:var(--sky);font-weight:700} .tabs svg{width:22px;height:22px}

details.demo{margin-top:24px;background:#fff;border:1.5px dashed var(--line);border-radius:14px;padding:10px 14px}
details.demo summary{cursor:pointer;color:var(--mute);font-size:14px} details.demo .row{margin-top:10px}
details.demo button{min-height:40px;padding:8px 12px;font-size:14px}
label.chk{display:flex;gap:10px;align-items:flex-start;color:var(--mute);font-size:14px} label.chk input{margin-top:3px;width:22px;height:22px;accent-color:var(--blue)}
.pad{padding-top:18px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.pad>*{min-width:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.rooS{height:140px;width:auto;justify-self:center;filter:drop-shadow(0 6px 8px rgba(14,43,32,.25))}
.mini{width:30px;height:30px;border-radius:10px;display:inline-grid;place-items:center;font:800 15px var(--display);color:#fff;background:rgba(255,255,255,.22);flex:0 0 auto}
.vh{display:flex;gap:8px;align-items:center;font-weight:800;font-size:15px}
.vhead{display:flex;gap:10px;align-items:center;font-weight:800;font-size:17px;min-width:0} .vhead .mini{background:linear-gradient(135deg,#2a6a50,var(--navy));width:38px;height:38px;border-radius:12px;font-size:18px}
.vhead .ver{color:var(--green)}
.stamp{display:grid;gap:12px}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.st{width:34px;height:34px;border-radius:50%;border:2px dashed #c9c2ad;display:grid;place-items:center;background:#fff}
.st.on{border:0;background:linear-gradient(135deg,var(--gold2),var(--gold));animation:pop .4s backwards}
.st.on::after{content:"";width:9px;height:16px;border:solid var(--gold-ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
a.rev{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;border:2px solid var(--blue);background:var(--sky);color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:10px 14px;text-align:center}
a.rev:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.brandrow{display:flex;align-items:flex-end;gap:8px} .rooH{height:76px;width:auto;margin:-10px 0 -8px -6px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.pc{display:grid;gap:10px} .pc.pull{margin-top:-52px;position:relative}
.pc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pc-l{font-weight:700;color:var(--mute);font-size:14px}
.pc-i{font-size:14px;font-weight:700;color:var(--green);background:var(--green-bg);border-radius:99px;padding:2px 10px}
.pc-n{display:flex;align-items:baseline;gap:8px;font:800 52px/1 var(--display);color:var(--navy);font-variant-numeric:tabular-nums} .pc-n small{font:500 16px var(--body);color:var(--mute)}
.track{position:relative;height:14px;border-radius:99px;background:var(--sky);margin:6px 0 0}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--green),#37d3a6);animation:grow 1s ease-out backwards;min-width:0}
.track.gold i{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.track b{position:absolute;top:-4px;width:4px;height:22px;border-radius:2px;background:var(--navy);opacity:.55}
.track b.m1{left:50%;margin-left:-2px} .track b.m2{right:0}
.marks{position:relative;height:34px;font-size:14px;font-weight:700;color:var(--mute);line-height:1.25}
.marks span{position:absolute;top:0;transform:translateX(-50%);text-align:center} .marks span.r{right:0;left:auto;transform:none;text-align:right}
.pc-next{margin:0;font-weight:700;font-size:16px;color:var(--navy);text-wrap:balance}
.pc-pend{display:flex;gap:10px;align-items:center;background:#fff6e0;color:#8a5a00;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;line-height:1.35} .pc-pend .pn{font:800 22px/1 var(--display);min-width:30px;text-align:center;font-variant-numeric:tabular-nums} .pc-pend.none{background:#efe9d8;color:var(--mute);font-weight:600}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{display:grid;gap:6px;justify-items:center;text-align:center;border:1.5px solid var(--line);border-radius:16px;padding:14px 8px;background:#fff}
.badge .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--sky);color:#9db0cf}
.badge .ic svg{width:24px;height:24px}
.badge.on{border-color:#f3d98b;background:#fffaf0} .badge.on .ic{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--gold-ink);animation:pop .5s backwards}
.badge b{font-size:14px} .badge span{font-size:14px;color:var(--mute)}
.sec{display:grid;gap:10px} .sec h2{margin:0}

.st.new{animation:pop .6s .5s cubic-bezier(.2,1.5,.4,1) backwards}
.near{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:#fff;border:1.5px solid var(--line);color:var(--ink);border-radius:16px;padding:12px;min-height:68px;font-weight:400;width:100%}
.near .mini{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#2a6a50,var(--navy));font-size:20px}
.near .nb{display:grid;gap:1px;min-width:0} .near .nb b{font-size:16px} .near .earn{font-size:14px}
.near>span:last-child{color:var(--mute);font-size:22px}
.kv{display:grid;gap:2px}
.rb{position:relative;display:block;flex:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.rb img{position:absolute;left:0;top:0;width:100%;height:100%;max-width:none;object-fit:contain;object-position:bottom;display:block}
.hero2 .rb{align-self:end;margin-left:-4px}
.brandrow .rb{margin:-10px 0 -8px -4px}
.burst .rb{justify-self:center}
.logo svg{width:28px;height:28px}.mini svg{width:18px;height:18px}.near .mini svg,.vhead .mini svg{width:22px;height:22px}
.logo,.mini,.vhead .mini,.near .mini{color:#fff}
.logo svg,.mini svg{stroke-width:2.1}
.logo svg{width:30px;height:30px}.near .mini svg,.vhead .mini svg{width:26px;height:26px}.deal .mini svg{width:20px;height:20px}
a.rev svg{width:20px;height:20px}

/* brand: wallet card */
.pc.panel{background:linear-gradient(160deg,#0a2018,#1d4a38)!important;border:0;color:#fff}
.pc-l{color:#c6d5cc!important}.pc-i{background:#ffffff22!important;color:#a8ecd2!important}
.pc-n{color:#f3d79c!important}.pc-n small{color:#c6d5cc!important}
.pc-next{color:#fff!important}.track{background:#ffffff2b!important}
.track i,.track.gold i{background:linear-gradient(90deg,#d9b068,#f3d79c)!important}
.track b{background:#fff!important;opacity:.7!important}
.marks,.marks span{color:#c6d5cc!important}
.fine a{color:var(--navy);font-weight:600}
.tbtn{display:flex;gap:8px;flex-wrap:wrap} .tbtn button{flex:1;min-width:90px}
.tapc{display:grid;gap:10px}.tapc .amt2{font:800 26px var(--display)}
.pill.orange{background:#fde7cf;color:#9f4c15}
.big-ok{font:800 40px/1.1 var(--display);color:var(--green);text-align:center}
.who{color:#c6d5cc;font-size:14px}
</style>

var cfg=window.TAPROO||{}; cfg.url=cfg.url||'https://oibtsdiacyhwtgbpwkja.supabase.co';
var sb=null,screen='load',ctx={},tok=null,who=null,taps=[],busy=false,poll=null;
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var $c=function(c){return '$'+(Number(c)/100).toFixed(2)};
var hm=function(ms){return new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Melbourne',hour:'numeric',minute:'2-digit'}).format(new Date(ms))};
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};
var sess={get:function(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del:function(k){try{sessionStorage.removeItem(k)}catch(e){}}};
var ROO=window.__ROO;
var roo='<span class="rb" style="width:48px;height:76px"><img src="'+ROO+'" alt="" width="48" height="76"></span>';
var SHIELD='<svg class="i" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>';
function dollars(v){var n=parseFloat(String(v).replace(/[$,\s]/g,''));return isFinite(n)&&n>=0?Math.round(n*100):null}
function header(sub){return '<div class="band"><div class="top"><div class="brandrow">'+roo+'<div class="brand"><b>Tap</b>Roo <span style="font:700 14px var(--body);color:#c6d5cc">Staff</span></div></div>'+(tok?'<button data-a="signout" style="min-height:34px;padding:4px 12px;font-size:14px">Sign out</button>':'<span class="secure">'+SHIELD+'Staff only</span>')+'</div><div class="hello" style="margin-top:14px">'+sub+'</div></div>'}
async function call(body){
  var r=await sb.functions.invoke('staff',{body:Object.assign({token:tok},body)});
  if(r.error){var j=null;try{j=await r.error.context.json()}catch(e){}
    var st=r.error.context&&r.error.context.status;
    return {err:(j&&(j.message||j.error))||'Something went wrong. Please try again.',status:st,badkey:(st===401||st===403)&&/api key|apikey/i.test(r.error.message||'')}}
  return {data:r.data};
}
function view(){
  clearInterval(poll);
  var main=screen==='taps'||screen==='code';$('tabs').hidden=!main;
  Array.prototype.forEach.call($('tabs').querySelectorAll('button'),function(b){if(b.dataset.go===screen)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  var h='';
  if(screen==='load')h=header('Loading…');
  if(screen==='setup')h=header('One-time setup')+'<div class="pad" style="margin-top:-40px"><div class="panel stack"><h1 style="font-size:26px">One-time setup</h1><p class="mute" style="margin:0">Paste the publishable key (starts with sb_publishable_). Never paste the secret key.</p><input id="setupkey" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Publishable key"><button class="blue block" data-a="setup">Save</button>'+(ctx.err?'<div class="toast">'+esc(ctx.err)+'</div>':'')+'</div></div>';
  if(screen==='login')h=header('Venue staff sign in')+'<div class="pad" style="margin-top:-40px"><div class="panel stack rise"><h1 style="font-size:26px">Sign in</h1><p class="mute" style="margin:0">Use the login name and PIN your venue manager gave you.</p>'
    +'<input id="ln" type="text" autocomplete="username" autocapitalize="off" placeholder="Login name" aria-label="Login name" value="'+esc(ctx.login||'')+'"><input id="pn" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" placeholder="PIN" aria-label="PIN">'
    +'<button class="blue block" data-a="signin">Sign in</button>'+(ctx.err?'<div class="toast">'+esc(ctx.err)+'</div>':'')+'<p class="fine" style="margin:0">Five wrong PINs lock the login for 15 minutes.</p></div></div>';
  if(screen==='taps'){
    h=header('Signed in as '+esc(who.name)+' at '+esc(who.venue))+'<div class="pad" style="padding-top:0;margin-top:-36px">'
     +(ctx.msg?'<div class="toast good">'+esc(ctx.msg)+'</div>':'')+(ctx.err?'<div class="toast">'+esc(ctx.err)+'</div>':'')
     +'<div class="panel rise"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Waiting taps</h2><button data-a="reload" style="min-height:34px;padding:4px 12px;font-size:14px">Refresh</button></div><p class="mute" style="margin:6px 0 0">Shoppers who tapped the stand. Confirm each visit. Updates every 20 seconds.</p></div>'
     +(taps.length?taps.map(tapCard).join(''):'<div class="panel"><p class="mute" style="margin:0">No taps waiting right now.</p></div>')+'</div>';
  }
  if(screen==='code')h=header('Check a reward code')+'<div class="pad" style="padding-top:0;margin-top:-36px"><div class="panel stack rise"><h2 style="margin:0">Shopper reward code</h2>'
    +'<input id="vc" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit code from the shopper" aria-label="Code">'
    +'<input id="vb" type="text" inputmode="decimal" placeholder="Bill total in dollars" aria-label="Bill total">'
    +'<label class="chk"><input type="checkbox" id="vx"> The bill total does not include alcohol, tobacco or lottery</label>'
    +'<button class="blue block" data-a="verify">Check code</button>'+(ctx.err?'<div class="toast">'+esc(ctx.err)+'</div>':'')+'</div>'
    +(ctx.ok?'<div class="panel rise" style="text-align:center"><div class="big-ok">Take '+$c(ctx.ok.discount_cents)+' off</div><p class="mute" style="margin:8px 0 0">Accepted. '+ctx.ok.points+' points used. The code cannot be used again.</p></div>':'')+'</div>';
  $('app').innerHTML=h;
  if(screen==='taps')poll=setInterval(function(){if(!busy&&!document.activeElement.matches('input'))loadTaps(true)},20000);
}
function tapCard(t){
  var waiting=t.status==='awaiting_amount';
  var st=waiting?'<span class="pill pend">Needs the bill amount</span>':(t.approved?'<span class="pill done">Confirmed</span>':'<span class="pill pend">Waiting for you</span>');
  var flag=t.orange?'<span class="pill orange">Second tap today: check it</span>':'';
  var id=esc(t.tap_id);
  var amt=waiting?'':'<div class="amt2">'+$c(t.amount_cents)+'</div>';
  var body=waiting
    ?'<input id="a-'+id+'" type="text" inputmode="decimal" placeholder="Bill total in dollars" aria-label="Bill total"><div class="tbtn"><button class="blue" data-do="enter" data-id="'+id+'">Save amount</button><button class="ghost" data-do="reject" data-id="'+id+'">Reject</button></div>'
    :'<div class="tbtn">'+((!t.approved||t.orange)?'<button class="blue" data-do="confirm" data-id="'+id+'">Confirm</button>':'')+'<button class="ghost" data-do="adjustform" data-id="'+id+'">Change amount</button><button class="ghost" data-do="reject" data-id="'+id+'">Reject</button></div>'
     +(ctx.adj===t.tap_id?'<input id="a-'+id+'" type="text" inputmode="decimal" placeholder="New bill total in dollars" aria-label="New amount"><button class="blue block" data-do="adjust" data-id="'+id+'">Save new amount</button>':'');
  return '<div class="panel tapc rise"><div class="row" style="justify-content:space-between"><b style="font-size:18px">'+esc(t.nickname)+'</b><span class="mute">'+hm(new Date(t.created_at).getTime())+'</span></div><div class="row">'+st+flag+'</div>'+amt+body+'</div>';
}
async function loadTaps(quiet){
  var r=await call({action:'list'});
  if(r.badkey)return resetKey();
  if(r.status===401){tok=null;sess.del('taproo_staff');return go('login',{err:'Please sign in again.'})}
  if(r.err){if(!quiet)ctx.err=r.err;return}
  taps=r.data.taps||[];if(!quiet){ctx.err=''}
  if(screen==='taps'&&!(document.activeElement&&document.activeElement.matches('input')))view();
}
function go(s,c){ctx=c||{};screen=s;view();scrollTo(0,0)}
function resetKey(){store.del('taproo_key');sb=null;go('setup',{err:'The saved key was not accepted, so it was cleared. Please paste the publishable key again.'})}
document.addEventListener('click',async function(e){
  var el=e.target.closest('button');if(!el||busy)return;
  if(el.dataset.go){return el.dataset.go==='taps'?(go('taps'),loadTaps()):go(el.dataset.go)}
  var a=el.dataset.a;
  if(a){busy=true;try{
    if(a==='setup'){var k=$('setupkey').value.trim();if(!/^sb_publishable_[A-Za-z0-9_-]+$/.test(k)&&!/^eyJ/.test(k))return go('setup',{err:'That does not look like a publishable key.'});store.set('taproo_key',k);busy=false;return start()}
    if(a==='signin'){var ln=$('ln').value.trim(),pn=$('pn').value.trim();
      var r=await call({action:'sign_in',login:ln,pin:pn});
      if(r.badkey)return resetKey();
      if(r.err)return go('login',{login:ln,err:r.err});
      tok=r.data.token;who=r.data;sess.set('taproo_staff',JSON.stringify({t:tok,w:who}));busy=false;go('taps');return loadTaps()}
    if(a==='signout'){tok=null;who=null;sess.del('taproo_staff');return go('login')}
    if(a==='reload'){busy=false;await loadTaps();return}
    if(a==='verify'){var code=$('vc').value.replace(/\D/g,''),bill=dollars($('vb').value);
      if(code.length!==6)return go('code',{err:'Enter the 6-digit code.'});
      if(bill===null)return go('code',{err:'Enter the bill total in dollars, like 18.50.'});
      if(!$('vx').checked)return go('code',{err:'Please confirm the bill total leaves out alcohol, tobacco and lottery.'});
      var v=await call({action:'verify_code',code:code,bill_cents:bill,excludes:true});
      var d=v.data||{};
      if(v.err)return go('code',{err:v.err});
      if(d.ok===false)return go('code',{err:d.message||'That code was not accepted.'});
      return go('code',{ok:d})}
  }finally{busy=false}}
  if(el.dataset.do){
    var act=el.dataset.do,id=el.dataset.id;
    var tp=taps.filter(function(x){return x.tap_id===id})[0];if(!tp)return;
    if(act==='adjustform'){ctx.adj=id;return view()}
    var body={action:act,tap_id:id};
    if(act==='enter'||act==='adjust'){var c=dollars($('a-'+id).value);if(c===null||c===0){ctx.err='Enter the bill total in dollars, like 18.50.';return view()}body.cents=c}
    if(act==='reject'&&!confirm('Reject this tap for '+tp.nickname+'? They will not get points.'))return;
    busy=true;el.disabled=true;
    try{var r2=await call(body);
      if(r2.status===401&&!r2.badkey){tok=null;return go('login',{err:'Please sign in again.'})}
      var d2=r2.data||{};
      if(r2.err||d2.ok===false){ctx={err:(d2.message||r2.err)};busy=false;await loadTaps(true);view();return}
      ctx={msg:act==='reject'?'Tap rejected.':'Saved.'};busy=false;await loadTaps(true);view();
    }finally{busy=false}
  }
});
function start(){
  var key=(cfg.key&&cfg.key.indexOf('PASTE_')!==0)?cfg.key:store.get('taproo_key');
  if(!key)return go('setup');
  if(typeof supabase==='undefined')return go('setup',{err:'Could not load the sign-in library. Check your internet connection and reload.'});
  try{sb=supabase.createClient(cfg.url,key,{auth:{persistSession:false}})}catch(e){store.del('taproo_key');return go('setup',{err:'That key was not accepted. Please paste it again.'})}
  var s=null;try{s=JSON.parse(sess.get('taproo_staff')||'null')}catch(e){}
  if(s&&s.t){tok=s.t;who=s.w;go('taps');return loadTaps()}
  go('login');
}
view();start();
})();

</script>
